<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DeepGuardAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-brand">
        🛡️ DeepGuardAI
      </a>
      <ul class="navbar-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="container" style="max-width: 500px; margin-top: 3rem;">
    <div class="card">
      <h2 class="card-title" style="text-align: center;">Welcome Back</h2>
      <p style="text-align: center; color: var(--text-light); margin-bottom: 2rem;">
        Login to access your dashboard
      </p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Login
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-light);">
        Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 600;">Register here</a>
      </p>

      <div style="margin-top: 2rem; padding: 1rem; background-color: var(--light-bg); border-radius: 0.5rem;">
        <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem;"><strong>Demo Admin Account:</strong></p>
        <p style="font-size: 0.875rem; color: var(--text-light); margin: 0;">Email: admin@deepguard.ai</p>
        <p style="font-size: 0.875rem; color: var(--text-light); margin: 0;">Password: admin123</p>
      </div>
    </div>
  </div>

  <!-- Chatbot -->
  <button class="chatbot-button" id="chatbot-button">💬</button>
  
  <div class="chatbot-window" id="chatbot-window">
    <div class="chatbot-header">
      <h3>AI Assistant</h3>
      <button class="chatbot-close" id="chatbot-close">×</button>
    </div>
    <div class="chatbot-messages" id="chatbot-messages">
      <div class="message message-bot">
        Hello! I'm your DeepGuardAI assistant. How can I help you today?
      </div>
    </div>
    <form class="chatbot-input" id="chatbot-form">
      <input type="text" id="chatbot-input" placeholder="Ask me anything..." required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const data = await apiRequest("https://deepguardai-backend.onrender.com", {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        // Save token and user
        setToken(data.token);
        setUser(data.user);

        showAlert('Login successful! Redirecting...', 'success');
        
        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = 'admin/dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 1500);

      } catch (error) {
        showAlert(error.message || 'Login failed', 'error');
      }
    });
  </script>
</body>
</html>
